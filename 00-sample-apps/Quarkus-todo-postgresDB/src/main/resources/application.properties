quarkus.http.port=8080

app.title=${APP_TITLE:"Welcome quarkus"}
app.image=${WELCOME_IMAGE:/images/sample-img.png}

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${POSTGRES_DB_URL:jdbc:postgresql://otel-postgres:5432/quarkustodo}
quarkus.datasource.username=${POSTGRES_DB_USERNAME:quarkustodo}
quarkus.datasource.password=${POSTGRES_DB_PASSWORD:quarkustodo}

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
