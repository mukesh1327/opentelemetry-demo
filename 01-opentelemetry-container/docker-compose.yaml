services:

# Kafka
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka-kraft
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_KRAFT_BROKER_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - otel-demo
    restart: unless-stopped

# Kafdrop
  kafdrop:
    image: docker.io/obsidiandynamics/kafdrop
    container_name: kafdrop
    restart: "no"
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
    depends_on:
      - "kafka"
    networks:
      - otel-demo

#======================================================

# Jaeger
  jaeger:
    image: docker.io/jaegertracing/jaeger
    container_name: jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_ZIPKIN_HTTP_PORT: 9411
      COLLECTOR_ZIPKIN_HTTP_PORT_ENABLED: "true"
    ports:
      - "8880:8888"
      - "8881:8889"
      - "16686:16686"
      - "4311:4317"
      - "4312:4318"
    networks:
      - otel-demo


# tempo
  tempo:
    image: docker.io/grafana/tempo
    container_name: tempo
    restart: unless-stopped
    ports:
      - "14269:14268"  # jaeger ingest
      - "3201:3200"   # tempo
      - "9096:9095" # tempo grpc
      - "4313:4317"  # otlp grpc
      - "4314:4318"  # otlp http
      - "9412:9411"   # zipkin
    user: 0:0
    privileged: true
    volumes:
      - ./tempo-container-configs/tempo-config.yml:/etc/tempo.yaml
      - tempo-var-data:/tmp/tempo/traces
    command: [ "-config.file=/etc/tempo.yaml" ]
    networks:
      - otel-demo


# Prometheus
  prometheus:
    image: docker.io/prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    user: 0:0
    privileged: true
    volumes:
      - ./prometheus-container-configs/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - otel-demo

# Grafana
  grafana:
    image: docker.io/grafana/grafana-enterprise:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_PLUGINS_PREINSTALL: "grafana-clock-panel, grafana-simple-json-datasource"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-container-configs/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    networks:
      - otel-demo

#======================================================

# Opentelemetry
  otelcol:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.106.1
    container_name: otel-collector
    restart: unless-stopped
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8888:8888" # Prometheus metrics
      - "9090:9090" # Prometheus metrics
    command: [ "--config=/etc/otelcol-contrib/config.yaml" ]
    user: 0:0
    privileged: true
    volumes:
      - ./otel-container-configs/otelcol-config.yaml:/etc/otelcol-contrib/config.yaml
    networks:
      - otel-demo
    depends_on:
       - kafka
       - prometheus

#======================================================

networks:
  otel-demo:
    external: true

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  tempo-var-data:
    driver: local
  kafka-data:
    driver: local
